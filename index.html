<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code creater</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="background-animation"></div>

    <div class="glass-container">
        <header>
            <h1>QR Code create</h1>
            <p>Create beautiful QR codes instantly</p>
        </header>

        <main>
            <div class="input-group">
                <input type="text" id="qr-text" placeholder="Enter URL or Text here..." autocomplete="off">
            </div>

            <div class="qr-display-area" id="qr-wrapper">
                <div id="qr-code"></div>
                <div class="placeholder-text" id="placeholder-text">Your QR Code will appear here</div>
            </div>

            <div class="controls-group">
                <div class="color-picker-wrapper">
                    <label for="color-dark">QR Color</label>
                    <input type="color" id="color-dark" value="#000000">
                </div>
                <div class="color-picker-wrapper">
                    <label for="color-light">Background</label>
                    <input type="color" id="color-light" value="#ffffff">
                </div>
            </div>



            <div class="history-area" id="history-area">
                <ul id="history-list" class="history-list"></ul>
            </div>
        </main>
    </div>

    <!-- qrcodejs library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
